name: Publish verified KVM application
on:
  push:
    branches: [feat/jetkvm-lan-provider]
    paths: [.github/workflows/publish-kvm-application.yaml]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'chmajster/Home-Assistant-nanokvm-rest-api' && github.ref == 'refs/heads/feat/jetkvm-lan-provider'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kvm-materialization-verification
          run-id: 36516967810
          github-token: ${{ github.token }}
          path: /tmp/kvm-verified-source
      - name: Copy verified application files without modifying workflows
        run: |
          python - <<'PY'
          import hashlib, io, pathlib, shutil, tarfile
          data = pathlib.Path('/tmp/kvm-verified-source/kvm-manager-source.tar.gz').read_bytes()
          assert hashlib.sha256(data).hexdigest() == 'e1ae15996a23f3dfddf06169334854d34080014ffa4a73fd77e426959b06a70d'
          root = pathlib.Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(data)) as archive:
              for member in archive.getmembers():
                  p = pathlib.Path(member.name)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                  if not member.isfile() or p.parts[0] == '.github':
                      continue
                  assert all(not parent.is_symlink() for parent in [p, *p.parents])
                  assert p.resolve().is_relative_to(root)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(archive.extractfile(member).read())
                  p.chmod(0o755 if member.mode & 0o111 else 0o644)
          shutil.rmtree('.kvm-source-transfer')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify application before publishing
        run: bash tools/verify_kvm.sh 2>&1 | tee verification.log
      - name: Publish application source to development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore .prettierignore README.md custom_components docs nanokvm_rest package.json package-lock.json pyproject.toml requirements-test.txt tests tools
          git add -u .kvm-source-transfer
          test -z "$(git diff --cached --name-only -- .github)"
          git commit -m 'feat: add JetKVM LAN provider, encrypted credentials and native WebRTC KVM'
          git push origin HEAD:feat/jetkvm-lan-provider
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Real browser WebRTC and H264 acceptance
        run: python tests/browser_jetkvm.py 2>&1 | tee browser-verification.log
      - name: Capture verification and source
        if: always()
        run: |
          mkdir -p test-results
          cp verification.log browser-verification.log test-results/ || true
          git rev-parse HEAD > test-results/commit.txt
          git archive --format=tar.gz HEAD -o test-results/kvm-manager-source.tar.gz
          git status --short > test-results/worktree-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kvm-publish-verification
          path: test-results
          retention-days: 7
