name: Integration Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile integration sources
        run: |
          python -m compileall -q custom_components/nanokvm_rest
          python -m compileall -q nanokvm_rest/integration/nanokvm_rest

      - name: Run repository contract tests
        run: python -m unittest discover -s tests -v
