name: Integration Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile integration sources
        run: |
          python -m compileall -q custom_components/nanokvm_rest
          python -m compileall -q nanokvm_rest/integration/nanokvm_rest
          python -m compileall -q nanokvm_rest/webui

      - name: Run repository contract tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js for Manager UI tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Manager UI and run regression tests
        run: |
          node --check nanokvm_rest/webui/static/app.js
          node --check nanokvm_rest/webui/static/remote-console-controller.js
          node --check nanokvm_rest/webui/static/remote-console-worker.js
          node --test tests/test_manager_ui.cjs

      - name: Package source snapshot for integration verification
        if: always()
        run: git archive --format=tar.gz HEAD -o /tmp/kvm-manager-source.tar.gz

      - name: Upload verification source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvm-manager-source
          path: /tmp/kvm-manager-source.tar.gz
          retention-days: 1
