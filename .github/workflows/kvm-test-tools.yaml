name: KVM Test Tools
on:
  push:
    branches: [feat/jetkvm-lan-provider]
    paths: [.github/workflows/kvm-test-tools.yaml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve isolated verification tools
        run: |
          mkdir -p /tmp/kvm-test-tools
          python -m pip download --dest /tmp/kvm-test-tools 'ruff<1' Flask==3.1.3 voluptuous
          cd /tmp/kvm-test-tools
          npm pack prettier
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: kvm-test-tools
          path: /tmp/kvm-test-tools
          retention-days: 1
