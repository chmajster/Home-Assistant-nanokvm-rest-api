name: Verify console fullscreen layout
on:
  push:
    branches: [feat/jetkvm-lan-provider]
    paths: [.github/workflows/verify-console-layout.yaml]
permissions:
  contents: read
jobs:
  layout:
    if: github.repository == 'chmajster/Home-Assistant-nanokvm-rest-api' && github.ref == 'refs/heads/feat/jetkvm-lan-provider'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped console layout correction
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, (path, old)
              p.write_text(text.replace(old, new))
          app = 'nanokvm_rest/webui/static/app.js'
          replace(app, '      <div class="console-toolbar">', '      <div id="console-shell" class="console-shell">\n      <div class="console-toolbar">')
          replace(app, '      </div>\n      <div id="console-shell" class="console-shell">\n        <div id="console-stage"', '      </div>\n        <div id="console-stage"')
          controller = 'nanokvm_rest/webui/static/jetkvm-console-controller.js'
          replace(controller, '      if (!this.video) return;\n      this.video.style.width =', '      if (!this.video) return;\n      this.video.dataset.scale = this.scale;\n      this.video.style.width =')
          css = 'nanokvm_rest/webui/static/style.css'
          replace(css, '''.console-shell:fullscreen .console-video-wrap video {
            max-height: calc(100dvh - 130px) !important;
          }''', '''/* Keep real controls inside fullscreen and reserve remaining space for video. */
          .console-shell:fullscreen {
            display: flex;
            flex-direction: column;
            overflow: hidden;
          }
          .console-shell:fullscreen > :not(.console-stage) {
            flex-shrink: 0;
          }
          .console-shell:fullscreen .console-stage {
            flex: 1;
            min-height: 0;
            grid-template-rows: minmax(0, 1fr) auto;
          }
          .console-shell:fullscreen .console-video-wrap {
            min-height: 0;
          }
          .console-shell:fullscreen video[data-scale="fit"] {
            width: 100%;
            height: 100%;
            max-height: 100% !important;
          }
          .console-toolbar {
            position: relative;
            z-index: 1;
            border-width: 0 0 1px;
            border-radius: 0;
          }
          .console-shell:fullscreen .console-toolbar {
            max-height: 30dvh;
            overflow: auto;
          }''')
          path = 'tests/browser_jetkvm.py'
          replace(path, '            await page.screenshot(path=str(output / "jetkvm-live.png"), full_page=True)', '''            await page.wait_for_function(
                          'document.getElementById("console-metrics").textContent.includes("FPS")'
                      )
                      await page.locator("#console-fullscreen").click()
                      await page.wait_for_function(
                          'document.fullscreenElement?.id === "console-shell"'
                      )
                      viewport_height = await page.evaluate("window.innerHeight")
                      for selector in ("#console-disconnect", "#console-scale", "#console-cad"):
                          assert await page.locator(selector).is_visible()
                          rect = await page.locator(selector).bounding_box()
                          assert 0 <= rect["y"] < viewport_height
                          assert rect["y"] + rect["height"] <= viewport_height
                      await page.locator("#console-scale").select_option("1")
                      await page.wait_for_function(
                          'document.getElementById("console-video").dataset.scale === "1"'
                      )
                      assert await page.locator("#console-video").evaluate(
                          '(v)=>v.getBoundingClientRect().width === v.videoWidth'
                      )
                      await page.locator("#console-scale").select_option("fit")
                      await page.screenshot(path=str(output / "jetkvm-fullscreen.png"))
                      await page.locator("#console-fullscreen").click()
                      await page.wait_for_function('document.fullscreenElement === null')
                      await page.evaluate("window.scrollTo(0, 0)")
                      await page.screenshot(path=str(output / "jetkvm-live.png"), full_page=True)''')
          replace(path, '                "ctrl_alt_delete": True,', '                "ctrl_alt_delete": True,\n                "fullscreen_controls_and_native_scale": True,')
          PY
      - name: Install isolated test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          npm ci --ignore-scripts --no-audit --no-fund
          ruff format tests/browser_jetkvm.py
          npx prettier --write nanokvm_rest/webui/static/app.js nanokvm_rest/webui/static/style.css nanokvm_rest/webui/static/jetkvm-console-controller.js
      - name: Verify all source and unit regressions
        run: bash tools/verify_kvm.sh 2>&1 | tee verification.log
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Verify fullscreen with actual WebRTC video
        run: python tests/browser_jetkvm.py 2>&1 | tee browser-verification.log
      - name: Commit only verified console changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nanokvm_rest/webui/static/app.js nanokvm_rest/webui/static/style.css nanokvm_rest/webui/static/jetkvm-console-controller.js tests/browser_jetkvm.py
          test -z "$(git diff --cached --name-only -- .github)"
          git commit -m 'fix: keep console controls usable in fullscreen and verify native video scale'
          git push origin HEAD:feat/jetkvm-lan-provider
      - name: Capture results
        if: always()
        run: |
          mkdir -p test-results
          for f in verification.log browser-verification.log; do
            if [ -f "$f" ]; then cp "$f" test-results/; fi
          done
          git rev-parse HEAD > test-results/commit.txt
          git archive --format=tar.gz HEAD -o test-results/kvm-manager-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kvm-fullscreen-verification
          path: test-results
          retention-days: 7
