name: Materialize and verify JetKVM source
on:
  push:
    branches: [feat/jetkvm-lan-provider]
    paths: [.github/workflows/apply-jetkvm-source.yaml]
permissions:
  contents: read
jobs:
  materialize:
    if: github.repository == 'chmajster/Home-Assistant-nanokvm-rest-api' && github.ref == 'refs/heads/feat/jetkvm-lan-provider'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct hash-verified UTF-8 source delta
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, shutil, subprocess, tempfile
          paths = '''.github/workflows/integration-contract.yaml
          .gitignore
          .prettierignore
          README.md
          custom_components/nanokvm_rest/__init__.py
          custom_components/nanokvm_rest/config_flow.py
          custom_components/nanokvm_rest/console.py
          custom_components/nanokvm_rest/diagnostics.py
          custom_components/nanokvm_rest/kvm_api.py
          custom_components/nanokvm_rest/manifest.json
          custom_components/nanokvm_rest/operations.py
          custom_components/nanokvm_rest/panel_ext.py
          custom_components/nanokvm_rest/panel_v2.py
          custom_components/nanokvm_rest/panel_v4.py
          custom_components/nanokvm_rest/providers/__init__.py
          custom_components/nanokvm_rest/providers/base.py
          custom_components/nanokvm_rest/providers/configuration.py
          custom_components/nanokvm_rest/providers/coordinator.py
          custom_components/nanokvm_rest/providers/discovery.py
          custom_components/nanokvm_rest/providers/errors.py
          custom_components/nanokvm_rest/providers/jetkvm.py
          custom_components/nanokvm_rest/providers/jetkvm_provider.py
          custom_components/nanokvm_rest/providers/nanokvm.py
          custom_components/nanokvm_rest/providers/network.py
          custom_components/nanokvm_rest/providers/registry.py
          custom_components/nanokvm_rest/providers/runtime.py
          custom_components/nanokvm_rest/providers/secrets.py
          custom_components/nanokvm_rest/providers/signaling.py
          custom_components/nanokvm_rest/providers/state.py
          custom_components/nanokvm_rest/strings.json
          custom_components/nanokvm_rest/translations/en.json
          custom_components/nanokvm_rest/translations/pl.json
          docs/jetkvm.md
          nanokvm_rest/CHANGELOG.md
          nanokvm_rest/Dockerfile
          nanokvm_rest/config.yaml
          nanokvm_rest/webui/app.py
          nanokvm_rest/webui/static/app.js
          nanokvm_rest/webui/static/device-setup.js
          nanokvm_rest/webui/static/jetkvm-console-controller.js
          nanokvm_rest/webui/static/remote-console-controller.js
          nanokvm_rest/webui/static/style.css
          nanokvm_rest/webui/templates/index.html
          package.json
          pyproject.toml
          requirements-test.txt
          tests/browser_jetkvm.py
          tests/kvm_test_support.py
          tests/test_jetkvm_console.cjs
          tests/test_jetkvm_protocol.py
          tests/test_kvm_crud.py
          tests/test_manager_inventory.py
          tests/test_manager_ui.cjs
          tests/test_nanokvm_console.cjs
          tools/verify_kvm.sh'''.splitlines()
          paths = [p.strip() for p in paths]
          assert len(paths) == 55 and paths == sorted(set(paths))
          base = {}
          for p in paths:
              r = subprocess.run(['git', 'show', 'HEAD:' + p], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              if r.returncode == 0:
                  base[p] = r.stdout.decode('utf-8')
          raw_base = json.dumps(base, ensure_ascii=False, separators=(',', ':')).encode()
          assert hashlib.sha256(raw_base).hexdigest() == 'f37c0dfd9ae3a1be769a8ddf92f78811c58a66710bc4bae29119c5e968d3095d', 'Base changed; refusing overwrite'
          parts = [pathlib.Path(f'.kvm-source-transfer/part{i}.b64').read_text().strip() for i in range(1, 6)]
          # Correct a single verified transcription error; the complete delta is hash-checked below.
          assert parts[0][8512] == 'z'
          parts[0] = parts[0][:8512] + 'x' + parts[0][8513:]
          delta = base64.b64decode(''.join(parts), validate=True)
          assert hashlib.sha256(delta).hexdigest() == 'da4e55294ca5f39f812fbccae9ab50743c5e02d43158fd0a3c81ffd1943e85a8'
          with tempfile.TemporaryDirectory() as td:
              d = pathlib.Path(td)
              (d / 'base.json').write_bytes(raw_base)
              (d / 'delta.zst').write_bytes(delta)
              subprocess.run(['zstd', '-d', '--patch-from=' + str(d / 'base.json'), str(d / 'delta.zst'), '-o', str(d / 'target.json')], check=True)
              raw_target = (d / 'target.json').read_bytes()
          assert hashlib.sha256(raw_target).hexdigest() == '59b9657df1eb09eeb037c74c21ecc85d52e0edc5a9e2312891e8424ca5fbdcd6'
          target = json.loads(raw_target)
          assert list(target['files']) == paths
          root = pathlib.Path.cwd().resolve()
          for name, text in target['files'].items():
              p = pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              assert all(not parent.is_symlink() for parent in [p, *p.parents])
              assert p.resolve().is_relative_to(root)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')
          shutil.copyfile('nanokvm_rest/webui/static/remote-console-controller.js', 'custom_components/nanokvm_rest/www/remote-console-controller.js')
          shutil.copytree('custom_components/nanokvm_rest', 'nanokvm_rest/integration/nanokvm_rest', dirs_exist_ok=True, ignore=shutil.ignore_patterns('__pycache__'))
          assert target['remove'] == ['.github/workflows/jetkvm-protocol-reference.yaml', '.github/workflows/kvm-test-tools.yaml']
          for p in target['remove']:
              pathlib.Path(p).unlink(missing_ok=True)
          shutil.rmtree('.kvm-source-transfer')
          pathlib.Path('.github/workflows/apply-jetkvm-source.yaml').unlink()
          pathlib.Path('tools/verify_kvm.sh').chmod(0o755)
          print('Materialized 55 verified source files and synchronized integration distribution.')
          PY
      - name: Install isolated verification dependencies
        run: |
          python -m pip install -r requirements-test.txt
          npm install --ignore-scripts --no-audit --no-fund
      - name: Formatter, lint, backend and frontend verification
        run: bash tools/verify_kvm.sh 2>&1 | tee verification.log
      - name: Commit verified source to development branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github .gitignore .prettierignore README.md custom_components docs nanokvm_rest package.json package-lock.json pyproject.toml requirements-test.txt tests tools
          git add -u .kvm-source-transfer
          git commit -m 'feat: integrate JetKVM LAN provider, encrypted credentials and native WebRTC KVM'
          git push origin HEAD:feat/jetkvm-lan-provider
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Real browser WebRTC and H.264 acceptance
        run: python tests/browser_jetkvm.py 2>&1 | tee browser-verification.log
      - name: Build production Home Assistant app image
        if: always()
        run: docker build --build-arg BUILD_VERSION=0.12.0 --build-arg BUILD_ARCH=amd64 -t nanokvm-manager:verification nanokvm_rest 2>&1 | tee build-verification.log
      - name: Smoke-test production image
        if: always()
        run: |
          docker run --rm --entrypoint /venv/bin/python nanokvm-manager:verification -c 'import sys; sys.path.insert(0,"/opt/webui"); import app; assert app.APP_VERSION == "0.12.0"; assert "nanokvm_rest/panel/kvm/manage" in app.WRITE_COMMANDS'
          docker run --rm --entrypoint /venv/bin/python nanokvm-manager:verification -m compileall -q /opt/integration /opt/webui
      - name: Capture verification results and exact source
        if: always()
        run: |
          mkdir -p test-results
          cp verification.log browser-verification.log build-verification.log test-results/ || true
          git rev-parse HEAD > test-results/commit.txt
          git archive --format=tar.gz HEAD -o test-results/kvm-manager-source.tar.gz
          git status --short > test-results/worktree-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kvm-materialization-verification
          path: test-results
          retention-days: 7
