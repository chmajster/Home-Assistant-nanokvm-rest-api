<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#08111f">
  <title>NanoKVM Manager</title>
  <link rel="stylesheet" href="static/style.css?v={{ version }}">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">NK</div>
        <div><strong>NanoKVM Manager</strong><small>Home Assistant</small></div>
      </div>
      <nav>
        <button class="nav active" data-view="overview">Dashboard</button>
        <button class="nav" data-view="devices">Urządzenia</button>
        <button class="nav" data-view="operations">Operations</button>
        <button class="nav" data-view="alerts">Alert Center</button>
        <button class="nav" data-view="updates">Update Center</button>
        <button class="nav" data-view="media">Virtual Media</button>
        <button class="nav" data-view="hid">HID Toolbox</button>
      </nav>
      <div class="sidebar-footer">v{{ version }}</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">Dashboard</h1>
          <p id="page-subtitle">Centrum zdalnego zarządzania NanoKVM</p>
        </div>
        <div class="top-actions">
          <button class="btn ghost" id="open-live">Live KVM</button>
          <button class="btn primary" id="refresh">Odśwież</button>
        </div>
      </header>

      <div id="notice" class="notice hidden"></div>
      <section id="content" class="content"><div class="loading">Ładowanie…</div></section>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Nawigacja NanoKVM Manager">
    <button data-view="overview" class="active"><span>Start</span></button>
    <button data-view="devices"><span>KVM</span></button>
    <button data-view="operations"><span>Ops</span></button>
    <button data-view="alerts"><span>Alerty</span></button>
    <button data-view="updates"><span>Update</span></button>
    <button data-view="media"><span>Media</span></button>
    <button data-view="hid"><span>HID</span></button>
  </nav>

  <script src="static/app.js?v={{ version }}"></script>
</body>
</html>
