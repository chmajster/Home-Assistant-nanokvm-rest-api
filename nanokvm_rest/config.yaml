name: "NanoKVM Manager"
slug: "nanokvm_rest"
description: >-
  NanoKVM fleet management Web UI with Home Assistant Ingress. Installs and
  updates the NanoKVM REST integration and provides dashboard, operations,
  updates, virtual media and HID management.
version: "0.11.10"
url: "https://github.com/chmajster/Home-Assistant-nanokvm-rest-api"
image: "ghcr.io/chmajster/{arch}-addon-nanokvm_rest"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
stage: stable
homeassistant: "2026.8.0"
ingress: true
ingress_port: 8099
homeassistant_api: true
panel_admin: true
panel_icon: "mdi:remote-desktop"
panel_title: "NanoKVM Manager"
watchdog: "http://[HOST]:[PORT:8099]/health/ready"
map:
  - type: homeassistant_config
    read_only: false
options: {}
schema: {}
